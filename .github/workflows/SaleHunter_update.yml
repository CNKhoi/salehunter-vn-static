name: Cap nhat voucher cong khai

on:
  workflow_dispatch:
  schedule:
    - cron: '8,38 * * * *'

permissions:
  contents: write

concurrency:
  group: salehunter-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Cai dependencies
        run: pip install -r requirements.txt
      - name: Thu thap va chuan hoa du lieu
        env:
          EXTERNAL_FEEDS: ${{ vars.EXTERNAL_FEEDS }}
          ENABLE_BLOG: 'true'
          ENABLE_NEWS: 'true'
        run: python scripts/update_feed.py
      - name: Kiem tra du lieu dau ra
        run: python -m unittest discover -s tests -v
      - name: Commit JSON neu thay doi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/offers.json data/source_cache.json
          if git diff --cached --quiet; then
            echo 'Khong co thay doi'
          else
            git commit -m 'chore: update public voucher feed'
            git push
          fi
